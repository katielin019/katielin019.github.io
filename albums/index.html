<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Albums</title>
    <script src="https://flackr.github.io/scroll-timeline/dist/scroll-timeline.js"></script>
<style>
    :root {
        --cover-size: 15rem;
        --size: 6;
    }

    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #111;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
    }

    .cards-wrapper {
        width: calc(var(--cover-size) * var(--size));
        margin: 0 auto;
        max-width: 90vw;
        overflow-x: scroll;
        padding: calc(var(--cover-size) / 3 * 2) 0;
        position: relative;
        perspective: 40em;
        outline: 1px solid #333;
        background: rgba(0, 0, 0, 0.5);
        scroll-snap-type: x mandatory;
    }

    .cards {
        display: flex;
        list-style: none;
        padding: 0;
        margin: 0;
        transform-style: preserve-3d;
    }

    .cards::before, .cards::after {
        content: "";
        flex: 0 0 calc(50% - (var(--cover-size) / 2));
    }

    .cards li {
        flex: 0 0 var(--cover-size);
        position: relative;
        perspective: 40em;
        scroll-snap-align: center;
    }

    .cards li img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        user-select: none;
    }
</style>
<script type="module">
    window.addEventListener('load', () => {
        if (typeof ViewTimeline !== 'undefined') {
            document.querySelectorAll('.cards li').forEach($li => {
                const timeline = new ViewTimeline({
                    subject: $li,
                    axis: 'inline',
                });

                $li.animate({
                    zIndex: [1, 100, 1],
                }, {
                    fill: 'both',
                    timeline,
                });

                const $img = $li.querySelector('img');
                if ($img) {
                    $img.animate([
                        { transform: 'translateX(-100%) rotateY(-45deg)', opacity: 0.5, offset: 0.0 },
                        { transform: 'translateX(0) rotateY(-45deg)', opacity: 1, offset: 0.35 },
                        { transform: 'rotateY(0deg) translateZ(1em) scale(1.5)', opacity: 1, offset: 0.50 },
                        { transform: 'translateX(0) rotateY(45deg)', opacity: 1, offset: 0.65 },
                        { transform: 'translateX(100%) rotateY(45deg)', opacity: 0.5, offset: 1.00 },
                    ], {
                        fill: 'both',
                        timeline,
                    });
                }
            });
        } else {
            console.error("Polyfill failed to load or ViewTimeline not supported.");
        }
    });
</script>
</head>
