<!DOCTYPE html>

    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Albums</title>
<script>
    if (!CSS.supports('animation-timeline', 'view()')) {
        console.warn("⚠️ Scroll-driven animations not supported. Loading polyfill...");
        const script = document.createElement('script');
        script.src = "https://flackr.github.io/scroll-timeline/dist/scroll-timeline.js";
        document.head.appendChild(script);
    }
</script>
<style>
    :root {
        --cover-size: 15rem;
        --size: 6;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #111;
        min-height: 100vh;
        display: grid;
        place-items: center;
    }

    @keyframes rotate-cover {
        0% { transform: translateX(-100%) rotateY(-45deg); opacity: 0.5; }
        35% { transform: translateX(0) rotateY(-45deg); opacity: 1; }
        50% { transform: rotateY(0deg) translateZ(1em) scale(1.5); opacity: 1; }
        65% { transform: translateX(0) rotateY(45deg); opacity: 1; }
        100% { transform: translateX(100%) rotateY(45deg); opacity: 0.5; }
    }

    @keyframes adjust-z-index {
        0% {
            z-index: 1;
        }
        50% {
            z-index: 100;
        }
        100% {
            z-index: 1;
        }
    }

    .cards-wrapper {
        width: calc(var(--cover-size) * var(--size));
        margin: 0 auto;
        max-width: 90vw;
        overflow-x: scroll;
        padding: calc(var(--cover-size) / 3 * 2) 0;
        position: relative;
        max-width: 90vw;

        perspective: 40em;
        outline: 1px solid #333;
        background: rgba(0 0 0 / 0.5);
        scroll-snap-type: x mandatory;
        box-sizing: border-box;
    }

    .cards {
        display: flex;
        list-style: none;
        whitespace: nowrap;
        transform-style: preserve-3d;

        box-sizing: border-box;
        padding: 0;
        margin: 0;
    }

    .cards::before, .cards::after {
        content: "";
        flex: 0 0 calc(50% - (var(--cover-size) / 2));
    }

    .cards li {
        flex: 0 0 var(--cover-size);
        position: relative;

        box-sizing: border-box;
        padding: 0;
        margin: 0;

        perspective: 40em;
        scroll-snap-align: center;
        animation: linear adjust-z-index both;
        animation-timeline: view(inline);
    }

    .cards li img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;

        animation: rotate-cover linear both;
        animation-timeline: view(inline);
    }
</style>
</head>
