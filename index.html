<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katie Lin</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<style>
		/* https://www.joshwcomeau.com/css/interactive-guide-to-grid/ */
		.parent {
			display: grid;
			grid-template-columns: 1fr 3fr;
			/* gap: 16px; */
			height: 100vh;
		}

		h1 {
			margin: 0;
		}

		.child {
			padding: 16px 32px;
		}

		.left {
			background-color: rgb(40, 40, 40);
			min-width: 18.5rem;
		}

		.right {
			/* background-color: darkslategrey; */
			overflow-y: scroll;
		}

		ol.work {
			column-count: 2;
		}

		@media only screen and (min-width: 0px) and (max-width: 768px) {
			.parent {
				display: block;
			}

			/* .left {
				position: sticky;
				top: 0;
				width: 100vw;
			} */

			ol.toc {
				column-count: 2;
				column-gap: 16px;
			}
		}
	</style>
</head>
<body>
	<main>
		<div class=parent>
			<div class="child left">
				<h1>blah blah blah</h1>
				<ol class="toc">
					<li>Some project name</li>
					<li>Some project name</li>
					<li>Some project name</li>
					<li>Some project name</li>
					<li>Some project name</li>
					<li>Some project name</li>
				</ol>
			</div>
			<div class="child right">
				<h1>blah blah blah</h1>
				<ol class="work">
					<li>
						<img src="assets/prompts-thumb.png">
					</li>
					<li>
						<img src="assets/prompts-thumb.png">
					</li>
					<li>
						<img src="assets/prompts-thumb.png">
					</li>
				</ol>
			</div>
		</div>
	</main>
	<footer>
	</footer>
</body>
</html>
