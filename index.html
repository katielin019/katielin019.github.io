<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Katie Lin</title>
<style>
html, body {
	font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
	color: white;
	background-color: sienna;
	margin: 0;
	padding: 0;
	height: 100%;
	width: 100%;
}

main {
	margin: 32px;
	margin-top: 16px;
	margin-bottom: 16px;
}

h1 {
	font-weight: 600;
	font-size: 1.75em;
	line-height: 1.5;
}

h1:hover {
	color: silver;
}

h1:hover > span {
	color: white;
}

h1 > span:hover {
	color: blue;
}

hr {
	/* top, bottom | left, right */
	margin: 2em 0em;
	opacity: 0.35;
}

.container {
	box-sizing: border-box;
}

/* https://codepen.io/teddyzetterlund/pen/YPjEzP */
.card {
	background-image: 
		linear-gradient(180deg, white 3rem, #F0A4A4 calc(3rem), #F0A4A4 calc(3rem + 2px), transparent 1px),
		repeating-linear-gradient(0deg, transparent, transparent 1.5rem, #DDD 1px, #DDD calc(1.5rem + 1px));
	box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.25);
	height: 14rem;
	width: 400px;

	margin: auto;
	position: relative;
	top: 50%;
	transform: translateY(-50%);
}
</style>
</head>

<body>
	<main>
		<h1>Katie Lin is a <span>product designer</span> and <span>engineer</style>.</h1>
		<p>I'm interested in alternative models of education, non-games<sup><a id=fn1 href=#footnote1>1</a></sup> and sandbox environments, social models of computing, design systems, the history of technology, and personal canons.</p>
		<div class=container>
			<div class=card></div>
		</div>
		<hr>
		<p class=footnote><sup><a id=footnote1 href=#fn1>1</a></sup> https://en.wikipedia.org/wiki/Non-game</p>
	</main>
	<footer>
		<div class=left>
			<p>Less, but better.</p>
		</div>
		<div class=right>
		</div>
	</footer>
</body>

</html>
