<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Katie Lin</title>
<style>
html, body {
	font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
	color: white;
	background-color: forestgreen;
	margin: 0;
	padding: 0;
	height: 100%;
	width: 100%;
}

main {
	/* top, bottom | left, right */
	margin: 16px 32px;
	display: flex;
	flex-wrap: wrap;
	justify-content: space-between;
}

section {
	background-color: sienna;
}

section > div.contents {
	padding: 16px;
}

section.card-lrg {
	flex: 0 1 48%;
}

section.card-med {
	flex: 0 1 24%;
}

h1 {
	font-weight: 600;
	font-size: 1.75em;
	line-height: 1.5;
}

h1:hover {
	color: silver;
}

h1:hover > span {
	color: white;
}

h1 > span:hover {
	color: blue;
}

hr {
	/* top, bottom | left, right */
	margin: 2em 0em;
	opacity: 0.35;
}
</style>
</head>

<body>
	<main>
		<section class=card-lrg>
			<div class=contents>
				<h1>Katie Lin is a <span>product designer</span> and <span>engineer</style>.</h1>
				<p>I'm interested in alternative models of education, non-games<sup><a id=fn1 href=#footnote1>1</a></sup> and sandbox environments, social models of computing, design systems, the history of technology, and personal canons.</p>
				<hr>
				<p class=footnote><sup><a id=footnote1 href=#fn1>1</a></sup> https://en.wikipedia.org/wiki/Non-game</p>
			</div>
		</section>
	</main>
</body>

</html>
