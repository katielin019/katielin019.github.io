<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Katie Lin</title>
<style>
html, body {
	font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
	color: white;
	background-color: sienna;
	margin: 0;
	padding: 0;
	height: 100%;
	width: 100%;
}

main {
	margin: 32px;
	margin-top: 16px;
	margin-bottom: 16px;
}

h1 {
	font-weight: 600;
	font-size: 1.75em;
	line-height: 1.5;
}

h1:hover {
	color: silver;
}

h1:hover > span {
	color: white;
}

h1 > span:hover {
	color: blue;
}

hr {
	/* top, bottom | left, right */
	margin: 2em 0em;
	opacity: 0.35;
}

div.container {
	display: flex;
	flex-direction: row;
	width: 100%;
	height: 100%;
}

footer {
	margin: 16px 32px;
}

@media only screen and (min-width: 0px) and (max-width: 960px) {
	div.container {
		display: block;
	}

	main > div.container > div.left {
		margin-bottom: 32px;
		max-width: 300px;
	}

	footer > div.two-cols {
		display: block;
	}
}
</style>
</head>

<body>
	<main>
		<div class=container>
			<section class=flex-left>
				<h1>Katie Lin is a <span>product designer</span> and <span>engineer</style>.</h1>
				<p>I'm interested in alternative models of education, non-games<sup><a id=fn1 href=#footnote1>1</a></sup> and sandbox environments, social models of computing, design systems, the history of technology, and personal canons.</p>
				<hr>
				<p class=footnote><sup><a id=footnote1 href=#fn1>1</a></sup> https://en.wikipedia.org/wiki/Non-game</p>
				<div class=work>
				</div>
			</section>
			<section class=flex-right>
				<div class=img-grid></div>
			</section>
		</div>
	</main>
	<footer class=two-cols>
		<div class=left>
			<p>Less, but better.</p>
		</div>
		<div class=right>
		</div>
	</footer>
</body>

</html>
