<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Katie Lin</title>
<style>
:root {
	margin: 0;
	padding: 0;
	background-color: sienna;
	color: white;
	font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
}

html, body {
	height: 100%;
	width: 100%;
}

body {
	margin: 0;
	display: flex;
	flex-direction: column;
	max-width: 100vw;
}

main {
	margin: 32px;
	margin-top: 16px;
	margin-bottom: 16px;
}

h1 {
	font-weight: 600;
	font-size: 1.75em;
	line-height: 1.5;
}

h1:hover {
	color: silver;
}

h1:hover > span {
	color: white;
}

h1 > span:hover {
	color: blue;
}

main > div.container {
	display: flex;
	flex-direction: row;
	justify-content: space-between;
	gap: 8%;
}

div.two-cols {
	display: flex;
	flex-direction: row;
	justify-content: space-between;
}

div.card {
	display: flex;
	height: 250px;
	margin-left: 5px;
	margin-right: 5px;
	flex: 1 1 200px;
	border: 2px white solid;
}

footer {
	padding: 1em;
	float: right;
	color: black;
}

@media only screen and (min-width: 0px) and (max-width: 960px) {
	div.container {
		display: block;
	}

	main > div.container > div.left {
		margin-bottom: 32px;
		max-width: 300px;
	}

	footer > div.two-cols {
		display: block;
	}
}
</style>
</head>

<body>
	<main>
		<div class='container two-cols'>
			<div class=left>
				<h1>Katie Lin is a <span>product designer</span> and <span>engineer</style>.</h1>
				<p>I'm interested in alternative models of education, non-games<sup><a id=fn1 href=#footnote1>1</a></sup> and sandbox environments, social models of computing, design systems, the history of technology, and personal canons.</p>
				<hr>
				<p class=footnote><sup><a id=footnote1 href=#fn1>1</a></sup> https://en.wikipedia.org/wiki/Non-game</p>
			</div>
			<div class=right>
				<div class=cards>
					<div class=card></div>
					<div class=card></div>
					<div class=card></div>
					<div class=card></div>
					<div class=card></div>
					<div class=card></div>
					<div class=card></div>
					<div class=card></div>
				</div>
			</div>
		</div>
	</main>
	<footer class=two-cols>
		<div class=left>
			<p>Less, but better.</p>
		</div>
		<div class=right>
		</div>
	</footer>
</body>

</html>
