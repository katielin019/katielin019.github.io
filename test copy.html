<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katie Lin</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: black;
            color: white;
        }

        main {
            margin: 40px 120px;
        }

        div.frame {
            display: inline-block;
            border: 1px white solid;
            width: 260px;
            height: 495px;
            overflow: hidden;
            position: relative;
        }

        #slide-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% - 32px);
            height: calc(100% - 32px);
            object-fit: cover;
            padding: 16px;
            /* transition: transform 2 ease-in-out; */
        }

        .before {
            z-index: 1;
        }

        .after {
            z-index: 2;
            transform: translateY(100%);
        }

        #slide-container:hover .after {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <main>
        <div id=slide-container class=frame>
            <img src="assets/saqf/frame-1.png" class="before">
            <img src="assets/saqf/frame-2.png" class="after">
        </div>

</body>

</html>
