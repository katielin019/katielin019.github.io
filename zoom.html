<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katie Lin</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: black;
            color: white;
        }

        main {
            margin: 40px 120px;
        }

        img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            object-position: 100% 0%;
            /* transform-origin: top center; */
        }

        /* img.reg {
            height: auto;
            width: 100%;
            object-fit: contain;
            transform-origin: bottom center;
        } */

        div.frame {
            display: inline-block;
            border: 1px white solid;
            width: 240px;
            height: 240px;
            padding: 64px 16px 0;
            overflow: hidden;
            /* position: relative; */
        }

        #slide img {
            animation-duration: 0.15s;
            animation-fill-mode: forwards;
            animation-timing-function: ease-out;
            animation-name: slide-down;
        }

        #slide:hover img {
            animation-duration: 0.2s;
            animation-fill-mode: forwards;
            animation-timing-function: ease-in;
            animation-name: slide-up;
        }

        @keyframes slide-down {
            0% {
                transform: translateY(-32px);
                height: auto;
            }

            100% {
                transform: translateY(16px);
                height: auto;
            }
        }

        @keyframes slide-up {
            0% {
                transform: translateY(16px);
                height: auto;
            }

            100% {
                transform: translateY(-32px);
                height: auto;
            }
        }

        #zoom img {
            animation-duration: 0.25s;
            animation-fill-mode: forwards;
            animation-timing-function: ease-out;
            animation-name: zoom-in;
        }

        #zoom:hover img {
            /* animation-name: on-hover;
            animation-duration: 1.2s;
            animation-fill-mode: forwards; */
            animation-duration: 0.4s;
            animation-fill-mode: forwards;
            animation-timing-function: ease-in;
            animation-name: zoom-out;
        }

        @keyframes zoom-out {
            0% {
                transform: scale(1) translateY(0);
                height: auto;
                opacity: 0.7;
            }

            100% {
                transform: scale(0.7) translateY(-180px);
                height: auto;
                opacity: 1;
            }
        }

        @keyframes zoom-in {
            0% {
                transform: scale(0.7) translateY(-180px);
                height: auto;
                opacity: 1;
            }

            100% {
                transform: scale(1) translateY(0);
                height: auto;
                opacity: 1;
            }
        }

        .title {
            font-size: 1.4rem;
            font-weight: 600;
            padding-bottom: 4px;
        }

        .subtitle {
            font-size: 1rem;
            font-weight: 400;
            /* text-transform: uppercase; */
            color: silver;
        }
    </style>
</head>

<body>
    <main>
        <div class=frame>
            <div class="title">HyprRun</div>
            <div class="subtitle">Building a product from 0 to 1</div>
        </div>
        <div id=zoom class=frame>
            <img src="assets/hyprrun/thumbnail.png">
        </div>
        
        <br><br>

        <div class=frame>
            <div class="title">Start a Quilt flow</div>
            <div class="subtitle">Redesigning a core feature</div>
        </div>

        <br><br>

        <div class=frame>
            <div class="title">Title Prompts</div>
            <div class="subtitle">Creating serendipity & driving engagement</div>
        </div>
        <div class="frame" id="slide">
            <img src="assets/prompts/frame-1.png">
            <!-- <img class=reg src="assets/prompts/thumbnail.png"> -->
        </div>
        <br><br>
    </main>
    <footer>
    </footer>
</body>

</html>
