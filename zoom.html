<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katie Lin</title>
	<style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: black;
        }

        main {
            margin: 40px 120px;
        }

        img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            object-position: 100% 0%;
            /* transform-origin: top center; */
        }

        div {
            display: inline-block;
            border: 1px white solid;
            width: 240px;
            height: 240px;
            padding: 64px 16px 0;
            overflow: hidden;
            /* position: relative; */
        }

        #zoom img {
            transition: transform 0.4s ease, opacity 0.4s ease;
            transform-origin: top center;
        }

        #zoom:hover img {
            animation-name: on-hover;
            animation-duration: 1.2s;
            animation-fill-mode: forwards;
        }

        @keyframes on-hover {
            0% {
                opacity: 0.7;
                height: auto;
            }
            100% {
                transform: scale(0.7) translateY(-180px);
                width: 240px;
                height: auto;
            }
        }
	</style>
</head>
<body>
	<main>
        <div id=zoom>
            <img src="assets/hyprrun/thumbnail.png">
        </div>
        <br>
        <br>
        <div>
            <img src="assets/hyprrun/thumbnail.png" style="object-fit: contain;">
        </div>
	</main>
	<footer>
	</footer>
</body>
</html>
